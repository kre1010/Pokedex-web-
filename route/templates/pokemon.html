<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex - Liste des Pokémon</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>Liste des Pokémon</h1>
    </header>

    <main>
        <div class="pokemon-grid">
            {{range .}}
            <a class="pokemon-card" href="/pokemon/{{.Id}}">
                <span class="pokemon-number">#{{.Id}}</span>
                <img src="{{.Sprites.Regular}}" alt="{{.Name.Fr}}" loading="lazy">
                <h2 class="pokemon-name">{{.Name.Fr}}</h2>
            </a>
            {{else}}
            <p class="empty-message">Aucun Pokémon trouvé pour le moment.</p>
            {{end}}
        </div>
    </main>
</body>
</html>
