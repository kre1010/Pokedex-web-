<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex - Liste des Pokémon</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>Liste des Pokémon</h1>

        <form method="GET" action="/pokemon" class="search-form">
            <label for="nom">Rechercher par nom :</label>
            <input
                type="text"
                id="nom"
                name="nom"
                value="{{.NomRecherche}}"
                placeholder="Ex : pika"
            >
            <button type="submit">Rechercher</button>
            {{if .NomRecherche}}
                <a href="/pokemon" class="search-reset">Réinitialiser</a>
            {{end}}
        </form>
    </header>

    <main>
        <div class="pokemon-grid">
            {{range .Pokemons}}
            <a class="pokemon-card" href="/pokemon/{{.PokedexID}}">
                <span class="pokemon-number">#{{.PokedexID}}</span>
                <img src="{{.Sprites.Regular}}" alt="{{.Name.Fr}}" loading="lazy">
                <h2 class="pokemon-name">{{.Name.Fr}}</h2>
            </a>
            {{else}}
            <p class="empty-message">
                {{if .NomRecherche}}
                    Aucun Pokémon trouvé pour « {{.NomRecherche}} ».
                {{else}}
                    Aucun Pokémon trouvé pour le moment.
                {{end}}
            </p>
            {{end}}
        </div>
    </main>
</body>
</html>
