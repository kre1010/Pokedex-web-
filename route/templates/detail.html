<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Détail Pokémon</title>
</head>
<body>
    <a href="/pokemon">← Retour à la liste</a>

    <article>
        <h2>#{{.Id}} - {{.Name.Fr}}</h2>
        <p><strong>Catégorie :</strong> {{.Category}}</p>
        <img src="{{.Sprites.Regular}}" alt="Illustration de {{.Name.Fr}}" width="140">

        <div>
            <strong>Types :</strong>
            {{range .Types}}
                <span>
                    <img src="{{.Image}}" alt="Icône type {{.Name}}" width="24" height="24">
                    {{.Name}}
                </span>
            {{end}}
        </div>
    </article>
</body>
</html>
